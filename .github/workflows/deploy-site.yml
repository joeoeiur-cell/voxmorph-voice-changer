name: Deploy website

# Builds the demo audio with the real VoxMorph DSP engine, then publishes
# website/ to GitHub Pages. Audio is generated rather than committed, so no
# binaries live in git and the samples always match the current DSP code.
#
# The configure-pages step below runs with `enablement: true`, which turns
# Pages on for the repository via the API the first time this workflow runs.
# Without it the deploy job fails with "Failed to create deployment (404)".

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'voxmorph/dsp/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable and configure GitHub Pages
        id: pages
        continue-on-error: true   # fails until Pages is switched on (see below)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Pages setup reminder
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages not enabled::Could not create the Pages site automatically. GITHUB_TOKEN is not permitted to create one. Enable it once under Settings -> Pages -> Build and deployment -> Source: GitHub Actions, then re-run this workflow."

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install "numpy<2.2" scipy numba soundfile piper-tts

      - name: Cache the TTS voice model
        uses: actions/cache@v6
        with:
          path: .cache/piper
          key: piper-en_US-ryan-medium-v1

      - name: Render demo audio through the DSP engine
        run: python website/build_audio.py

      - name: Verify the site is complete
        run: |
          test -f website/index.html
          test -f website/app.js
          test -f website/styles.css
          count=$(ls website/audio/*.mp3 website/audio/*.wav 2>/dev/null | wc -l)
          echo "audio clips: $count"
          test "$count" -ge 9

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
