name: Deploy website

# Builds the demo audio with the real VoxMorph DSP engine, then publishes
# website/ to GitHub Pages. Audio is generated rather than committed, so no
# binaries live in git and the samples always match the current DSP code.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'voxmorph/dsp/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install numpy scipy numba soundfile piper-tts

      - name: Cache the TTS voice model
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en_US-ryan-medium-v1

      - name: Render demo audio through the DSP engine
        run: python website/build_audio.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
