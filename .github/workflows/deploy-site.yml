name: Deploy website

# Renders the demo audio with the real VoxMorph DSP engine, then publishes
# website/ to the `gh-pages` branch.
#
# Why a branch instead of the Pages deployment API: creating a Pages *site*
# requires repo-administration rights that GITHUB_TOKEN does not have
# ("Resource not accessible by integration"), which made the API route fail
# until someone flipped the switch by hand. Pushing a branch only needs
# `contents: write`, which the workflow token does have, so this route works
# unattended. GitHub serves a public repo's gh-pages branch automatically.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'voxmorph/dsp/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install audio toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install "setuptools<81" "numpy<2.2" scipy numba soundfile piper-tts pyworld
          python -c "import pyworld, numpy; print(f'pyworld ok, numpy {numpy.__version__}')"

      - name: Cache the TTS voice model
        uses: actions/cache@v6
        with:
          path: .cache/piper
          key: piper-en_US-ryan-medium-v1

      - name: Render demo audio through the DSP engine
        run: python website/build_audio.py

      - name: Verify the site is complete
        run: |
          test -f website/index.html
          test -f website/app.js
          test -f website/styles.css
          count=$(ls website/audio/*.mp3 website/audio/*.wav 2>/dev/null | wc -l)
          echo "audio clips rendered: $count"
          test "$count" -ge 10

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd website
          touch .nojekyll          # serve _-prefixed paths verbatim
          rm -f build_audio.py     # source script does not belong on the site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "Published $(ls -1 | wc -l) top-level entries to gh-pages"

      - name: Summary
        run: |
          owner=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)
          name=$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)
          echo "### Website published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch \`gh-pages\` updated. Site URL:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://$owner.github.io/$name/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If it 404s, set **Settings -> Pages -> Source: Deploy from a branch -> gh-pages / (root)**." >> $GITHUB_STEP_SUMMARY
